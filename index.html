<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROJECT: APOCALYPSE</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05090d;--ink:#e6f1f4;--dim:#8fa7b0;--line:#3b6574;--glow:#7fd6e8;--box:rgba(6,14,20,.86);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Nanum Myeongjo','Apple SD Gothic Neo','Malgun Gothic',serif}
#stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#000;user-select:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center top;opacity:0;transition:opacity .9s}
.bg.on{opacity:1}
.bg.dim{filter:brightness(.45) blur(1px)}
#vig{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0,rgba(0,0,0,0) 48%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#loc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;font-size:12px;color:var(--dim);letter-spacing:.08em}
#skip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:12px;padding:4px 10px;border-radius:2px}
#box{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);min-height:148px;padding:20px 18px 16px;background:var(--box);border:1px solid var(--line);border-radius:3px}
#name{position:absolute;top:-14px;left:14px;background:#0b1c26;border:1px solid var(--glow);color:var(--glow);padding:2px 12px;font-size:13px;font-weight:700}
#name:empty{display:none}
#txt{font-size:16px;line-height:1.75;min-height:84px;white-space:pre-wrap}
#txt.note{color:var(--dim);font-style:italic}
#next{position:absolute;right:14px;bottom:8px;color:var(--glow);font-size:12px;animation:b 1.2s infinite}
@keyframes b{50%{opacity:.2}}
#choices{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;flex-direction:column;gap:10px}
#choices .q{font-size:13px;color:var(--dim);text-align:center;margin-bottom:2px}
.c{background:var(--box);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:15px;line-height:1.5;text-align:left;padding:13px 15px;border-radius:3px;cursor:pointer}
.c:active,.c:focus-visible{border-color:var(--glow);outline:none;background:#0b2230}
.c.done{color:#5f7882;border-style:dashed}
.c.end{text-align:center;color:var(--glow);border-color:var(--glow)}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.82);text-align:center;padding:30px}
#end h1{font-size:22px;letter-spacing:.14em;margin:0 0 10px}
#end p{color:var(--dim);font-size:14px;margin:0 0 22px}
#end button{background:none;border:1px solid var(--glow);color:var(--glow);font:inherit;padding:10px 22px;border-radius:2px}
@media (prefers-reduced-motion:reduce){#next{animation:none}.bg{transition:none}}

/* 깨어나는 연출 */
#lids{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}
#stage.waking #lids{display:block}
.lid{position:absolute;left:-25%;width:150%;height:56%;background:#000;box-shadow:0 0 60px 40px #000}
.lid.t{top:0;border-radius:0 0 50% 50%/0 0 70% 70%;transform:translateY(0)}
.lid.b{bottom:0;border-radius:50% 50% 0 0/70% 70% 0 0;transform:translateY(0)}
#stage.waking .lid.t{animation:lt 5.2s cubic-bezier(.4,0,.2,1) forwards}
#stage.waking .lid.b{animation:lb 5.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes lt{0%,14%{transform:translateY(0)}26%{transform:translateY(-22%)}34%{transform:translateY(-4%)}40%{transform:translateY(-4%)}56%{transform:translateY(-48%)}64%{transform:translateY(-30%)}72%{transform:translateY(-30%)}100%{transform:translateY(-130%)}}
@keyframes lb{0%,14%{transform:translateY(0)}26%{transform:translateY(22%)}34%{transform:translateY(4%)}40%{transform:translateY(4%)}56%{transform:translateY(48%)}64%{transform:translateY(30%)}72%{transform:translateY(30%)}100%{transform:translateY(130%)}}
#stage.waking .bg.on{animation:wk 5.6s ease-out forwards}
@keyframes wk{0%{filter:blur(14px) brightness(.35);transform:scale(1.08)}55%{filter:blur(7px) brightness(.6);transform:scale(1.05)}100%{filter:blur(0) brightness(1);transform:scale(1)}}
#stage.waking #box,#stage.waking #loc,#stage.waking #vig{opacity:0}
#box,#loc,#vig{transition:opacity .8s}
#tapw{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#000;color:var(--dim);font-size:13px;letter-spacing:.2em;cursor:pointer;transition:opacity .6s}
#tapw b{font-size:20px;letter-spacing:.3em;color:var(--ink);font-weight:400}
#tapw span{animation:b 1.6s infinite}
#tapw.out{opacity:0;pointer-events:none}
#heart{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(120,0,0,.0) 60%,rgba(80,0,0,.55));opacity:0}
#stage.waking #heart{animation:hb 1.3s ease-in-out 3}
@keyframes hb{0%,100%{opacity:0}15%{opacity:.8}30%{opacity:.2}45%{opacity:.6}}
@media (prefers-reduced-motion:reduce){#stage.waking .lid,#stage.waking .bg.on,#stage.waking #heart{animation:none}#stage.waking #lids{display:none}}
</style>
</head>

  [Y,'이름과 소속 부대는… 기억이 돌아오는 속도를 보며 말씀드리겠습니다. 한꺼번에 들으면 충격이 클 수 있습니다.']]},
 {c:'대체 세상에 무슨 일이 벌어진 겁니까? 전쟁이라니…',a:[
  [Y,'2268년, 자원이 고갈되고 영토 분쟁이 번지며 전쟁이 시작됐습니다. 신생 국가 페룸은 그 와중에 칼리기가스를 개발했고요.'],
  [Y,'그리고 운석이 떨어졌습니다. 거기서 카엘데스가 나왔습니다. 인류는 사람끼리 싸울 여유가 없어졌죠.'],
  [Y,'우두머리 테론은 약 100년 전, 전설적인 파일럿과 2세대 기체가 쓰러뜨렸습니다. 하지만 카엘데스는 아직도 나타납니다.']]},
 {c:'칼리기가스… 그리고 저를 다치게 한 건 뭡니까?',a:[
  [Y,'칼리기가스는 거대 인간형 기체입니다. 현재는 3세대가 운용되고 있습니다. 코어와 공명하는 파르모만 제대로 움직일 수 있습니다.'],
  [Y,'당신의 기체를 부순 건 카엘데스입니다. 검은 외피에, 개체마다 몸의 일부가 빛나는 괴물이죠.'],
  [Y,'…이번 개체는 평소와 달랐습니다. 자세한 건 나중에 말씀드리겠습니다.']]},
 {c:'……당신은 왜 직접 온 겁니까? 믿어도 되는 겁니까?',a:[
  [Y,'좋은 질문입니다. 파르모는 극소수이고, 당신은 지금 페룸이 잃을 수 없는 전력입니다.'],
  [Y,'그리고 기체가 부서진 경위에 석연치 않은 점이 있습니다. 병원 직원에게 맡기고 싶지 않았습니다.'],
  [Y,'믿으실지는 당신이 정하십시오. 다만, 지금 병실에서 이 이야기를 아는 사람은 저뿐입니다.']]}
];
let steps=[],i=0,typing=null,full='',asked=new Set(),mode='story';
function show(s){
  if(s.bg){['b1','b2'].forEach(k=>$(k).classList.toggle('on',k===s.bg));}
  if(s.loc)$('loc').textContent=s.loc;
  $('name').textContent=s.n||'';
  $('txt').className=s.note?'note':'';
  full=s.t;let k=0;$('txt').textContent='';$('next').style.visibility='hidden';
  clearInterval(typing);
  typing=setInterval(()=>{k++;$('txt').textContent=full.slice(0,k);if(k>=full.length){clearInterval(typing);typing=null;$('next').style.visibility='visible'}},reduce()?0:26);
}
function reduce(){return matchMedia('(prefers-reduced-motion:reduce)').matches}
function advance(){
  if(typing){clearInterval(typing);typing=null;$('txt').textContent=full;$('next').style.visibility='visible';return}
  i++;
  if(i<steps.length)show(steps[i]);else after();
}
function after(){mode==='story'?menu():menu()}
function menu(){
  mode='menu';$('box').style.display='none';$('b2').classList.add('dim');
  const w=$('choices');w.innerHTML='<div class="q">무엇을 물어보시겠습니까?</div>';
  Q.forEach((q,n)=>{const b=document.createElement('button');b.className='c'+(asked.has(n)?' done':'');b.textContent=q.c;b.onclick=()=>pick(n);w.appendChild(b)});
  if(asked.size>=2){const e=document.createElement('button');e.className='c end';e.textContent='(질문을 마친다)';e.onclick=finish;w.appendChild(e)}
  w.style.display='flex';
}
function pick(n){
  asked.add(n);$('choices').style.display='none';$('b2').classList.remove('dim');$('box').style.display='block';
  mode='story';
  steps=[{n:'나',t:Q[n].c}].concat(Q[n].a.map(a=>({n:a[0],t:a[1]})));i=0;show(steps[0]);
}
function finish(){$('choices').style.display='none';$('end').style.display='flex'}
let wakeT=null;
function wakeDone(){if(!$('stage').classList.contains('waking'))return;clearTimeout(wakeT);$('stage').classList.remove('waking');mode='story';show(steps[0])}
function start(){asked.clear();$('end').style.display='none';$('choices').style.display='none';$('box').style.display='block';$('b2').classList.remove('dim');steps=S1;i=0;
  clearInterval(typing);typing=null;$('txt').textContent='';$('name').textContent='';$('next').style.visibility='hidden';
  ['b1','b2'].forEach(k=>$(k).classList.toggle('on',k==='b1'));$('loc').textContent=S1[0].loc;
  mode='wake';const st=$('stage');st.classList.remove('waking');void st.offsetWidth;st.classList.add('waking');
  wakeT=setTimeout(wakeDone,reduce()?300:5600)}
$('box').addEventListener('click',advance);
$('stage').addEventListener('click',e=>{if(mode==='wake'&&!$('tapw').contains(e.target))wakeDone()});
$('tapw').addEventListener('click',e=>{e.stopPropagation();$('tapw').classList.add('out');start()});
$('skip').addEventListener('click',e=>{e.stopPropagation();if(mode==='wake'){wakeDone();return}if(mode==='story'&&steps===S1){i=steps.length-1;show({...steps[i]});clearInterval(typing);typing=null;$('txt').textContent=full;$('next').style.visibility='visible'}});
$('again').onclick=start;
document.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!$('tapw').classList.contains('out')){e.preventDefault();$('tapw').click();return}if((e.key===' '||e.key==='Enter')&&mode==='wake'){e.preventDefault();wakeDone();return}if((e.key===' '||e.key==='Enter')&&$('choices').style.display!=='flex'&&$('end').style.display!=='flex'){e.preventDefault();advance()}});
['b1'].forEach(k=>$(k).classList.add('on'));$('stage').classList.add('waking');mode='wake';
</script>
</body>
</html>
